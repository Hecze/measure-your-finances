services:
  gastos:
    build: .
    container_name: mis-gastos
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # solo local; ponlo detrás de un proxy con HTTPS si lo expones
    volumes:
      - ./data:/data

  # Opcional: LLM 100% local con Ollama (descomenta y usa LLM_PROVIDER=openai_compatible,
  # LLM_BASE_URL=http://ollama:11434/v1, LLM_MODEL=llama3.1)
  # ollama:
  #   image: ollama/ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ./ollama:/root/.ollama
