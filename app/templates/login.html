<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Gastos · Entrar</title><link rel="stylesheet" href="/static/app.css"></head>
<body style="padding:0">
<main style="max-width:380px;margin:12vh auto;padding:16px">
  <div class="card stack">
    <div class="brand"><span class="brand-dot"></span>Mis Gastos</div>
    <form method="post" action="/login" class="stack">
      <div><label for="pw">Contraseña</label><input id="pw" type="password" name="password" autofocus required></div>
      {% if error %}<div class="chip bad">{{ error }}</div>{% endif %}
      <button class="btn primary" style="width:100%;justify-content:center">Entrar</button>
    </form>
  </div>
</main></body></html>
