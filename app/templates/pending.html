{% extends "base.html" %}
{% block content %}
<div id="card" class="card-tx"></div>
{% endblock %}
{% block scripts %}
<script>
const queue = {{ queue | tojson }};
const cats = {{ cats | tojson }};
const single = {{ 'true' if single else 'false' }};
let i = 0;
const el = document.getElementById("card");

function next() { i++; show(); }

function show() {
  if (i >= queue.length) {
    if (single) { history.length > 1 ? history.back() : (location.href = "/"); return; }
    el.innerHTML = `<div class="done"><div>✓</div><h1>Todo al día</h1><a class="btn primary" href="/">Volver al inicio</a></div>`;
    return;
  }
  const it = queue[i];
  const count = single ? "" : `${i + 1} de ${queue.length}`;
  if (it.type === "tx") {
    App.txCard(el, it, cats, { count, skip: !single, onDone: (r) => { if (r !== "skip") App.toast(r === "excluded" ? "No se cuenta" : "Guardado"); next(); } });
  } else if (it.type === "yape") {
    el.innerHTML = `
      ${count ? `<div class="count">${count}</div>` : ""}
      <div class="amount">📥</div>
      <div class="who">Actualiza tus yapeos</div>
      <p class="muted" style="margin-top:10px">Yape no avisa por correo cuando le pagas a una persona.
      ${it.last ? "Lo último que tenemos es del " + it.last + "." : "Aún no tenemos tu historial."}</p>
      <div class="hint">En la app de Yape, pide tu <b>historial de movimientos</b>.
      ${it.auto ? "Llega a tu correo y lo leemos solos." : "Te llega por correo: súbelo aquí."}</div>
      <div class="actions">
        <button class="btn" data-later>Ya lo pedí</button>
        <a class="btn primary" href="/importar">Subir Excel</a>
      </div>`;
    el.querySelector("[data-later]").onclick = next;
  } else if (it.type === "email") {
    el.innerHTML = `
      ${count ? `<div class="count">${count}</div>` : ""}
      <div class="amount">✉️</div>
      <div class="who">No pudimos leer este correo</div>
      <div class="when">${App.esc(it.subject)}</div>
      <p class="muted" style="margin-top:10px">Preferimos preguntarte antes que adivinar.</p>
      <div class="actions">
        <button class="btn" data-skip>Saltar</button>
        <a class="btn primary" href="/correos/${it.id}">Revisar</a>
      </div>`;
    el.querySelector("[data-skip]").onclick = next;
  }
  window.scrollTo(0, 0);
}
show();
</script>
{% endblock %}
